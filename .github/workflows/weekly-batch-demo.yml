
name: Weekly Batch Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run weekly batch safety tests
        run: python test_weekly_batch.py

      - name: Build weekly batch CSV
        run: python run_weekly_batch.py

      - name: Save weekly batch
        uses: actions/upload-artifact@v4
        with:
          name: WeeklyBatch
          path: batch-output/WeeklyBatch_*.csv
