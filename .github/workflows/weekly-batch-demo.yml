
name: Weekly Batch Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run weekly batch safety tests
        run: python test_weekly_batch.py
