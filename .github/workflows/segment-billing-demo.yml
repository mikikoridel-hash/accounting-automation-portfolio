
name: Segment Billing Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segment-billing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build original and correction billing
        run: python run_segment_billing.py

      - name: Save invoice details and summaries
        uses: actions/upload-artifact@v4
        with:
          name: Segment-Billing-Details
          path: segment-output/*.csv

      - name: Save weekly batches
        uses: actions/upload-artifact@v4
        with:
          name: Segment-Weekly-Batches
          path: batch-output/WeeklyBatch_*.csv
