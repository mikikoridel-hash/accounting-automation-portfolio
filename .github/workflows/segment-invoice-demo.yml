
name: Segment Invoice Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segment-invoice:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build original and correction invoices
        run: python SegmentInvoice.py

      - name: Save invoice details and unit summaries
        uses: actions/upload-artifact@v4
        with:
          name: Segment-Invoice-Results
          path: segment-output/*.csv
