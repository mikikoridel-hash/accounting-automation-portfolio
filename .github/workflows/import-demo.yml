name: Import Super Bill Demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'raw/**'
      - 'ImportTool.py'
      - 'test_import.py'
      - '.github/workflows/import-demo.yml'

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run incremental update tests
        run: python test_import.py

      - name: Import demo workbooks
        run: python ImportTool.py

      - name: Save output
        uses: actions/upload-artifact@v4
        with:
          name: MasterData-and-ImportLog
          path: output/*.csv
